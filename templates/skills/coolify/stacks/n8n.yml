# n8n em modo fila (queue) — padrão Automarketing.
#
# Estrutura: n8n (editor/webhook) + n8n-worker + task-runners + Postgres + Redis.
# O modo fila é o que aguenta volume: o editor não trava enquanto os workers executam.
#
# Sobe com:
#   node coolify.mjs stack stacks/n8n.yml n8n-cliente \
#     --projeto <uuid> --servidor <uuid> --dominio https://editor.cliente.com.br --deploy
#
# Variáveis que VOCÊ define (as SERVICE_* a Coolify gera sozinha):
#   N8N_EDITOR_URL   https://editor.cliente.com.br
#   N8N_WEBHOOK_URL  https://webhook.cliente.com.br/     ← com a barra no final
#   N8N_HOSTNAME     editor.cliente.com.br               ← sem protocolo
#
# Dois domínios de propósito: o editor fica protegido e o webhook é público.
# Antes de subir, crie os dois no DNS:
#   node .../cloudflare.mjs sub cliente.com.br editor webhook
#
# ⚠️ SERVICE_PASSWORD_ENCRYPTION é a N8N_ENCRYPTION_KEY. A Coolify gera na primeira
# subida e guarda. Se você recriar a stack do zero com outra chave, TODAS as
# credenciais salvas no n8n viram lixo. Em migração, ela tem que ser a mesma.

services:
  n8n:
    image: 'n8nio/n8n:2.10.4'
    environment:
      - SERVICE_URL_N8N_5678
      - 'N8N_EDITOR_BASE_URL=${N8N_EDITOR_URL}'
      - 'WEBHOOK_URL=${N8N_WEBHOOK_URL}'
      - 'N8N_HOST=${N8N_HOSTNAME}'
      - N8N_PROTOCOL=https
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - 'DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}'
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=$SERVICE_USER_POSTGRES
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - 'N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}'
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PROXY_HOPS=1
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=false
    volumes:
      - 'n8n-data:/home/node/.n8n'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5678/healthz'
      interval: 5s
      timeout: 20s
      retries: 10

  n8n-worker:
    image: 'n8nio/n8n:2.10.4'
    command: worker
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - 'DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}'
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=$SERVICE_USER_POSTGRES
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - 'N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}'
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PROXY_HOPS=1
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=false
    volumes:
      - 'n8n-data:/home/node/.n8n'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5678/healthz'
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      n8n:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgresql:
    image: 'postgres:16-alpine'
    volumes:
      - 'postgresql-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - 'POSTGRES_DB=${POSTGRES_DB:-n8n}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: 'redis:6-alpine'
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  task-runners:
    image: 'n8nio/runners:2.10.4'
    environment:
      - 'N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679'
      - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=60
      - N8N_RUNNERS_MAX_CONCURRENCY=5
    depends_on:
      - n8n
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5680/healthz'
      interval: 5s
      timeout: 20s
      retries: 10

  task-runner-worker:
    image: 'n8nio/runners:2.10.4'
    environment:
      - 'N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679'
      - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=60
      - N8N_RUNNERS_MAX_CONCURRENCY=5
    depends_on:
      - n8n-worker
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5680/healthz'
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  n8n-data:
  postgresql-data:
  redis-data:
