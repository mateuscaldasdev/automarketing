# Stack n8n para a Coolify.
# Sobe com:
#   node coolify.mjs stack stacks/n8n.yml n8n-cliente \
#     --projeto <uuid> --servidor <uuid> --dominio https://n8n.cliente.com.br --deploy
#
# Antes: crie o DNS com a skill cloudflare (CNAME n8n -> vps.cliente.com.br, proxy off).
# Depois: defina N8N_ENCRYPTION_KEY com `node coolify.mjs env <uuid> N8N_ENCRYPTION_KEY=...`
#         (perder essa chave inutiliza as credenciais salvas — guarde no gerenciador de senhas).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${SERVICE_FQDN_N8N}
      - WEBHOOK_URL=${SERVICE_FQDN_N8N}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Autenticação da própria interface do n8n
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Banco em Postgres (recomendado em produção; sem isso usa SQLite local)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
      - n8n-arquivos:/files
    depends_on:
      n8n-db:
        condition: service_healthy

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  n8n-data:
  n8n-arquivos:
  n8n-db-data:
